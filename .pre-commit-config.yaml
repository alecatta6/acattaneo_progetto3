# Installed by `make setup`. Keeps commits lint-clean without waiting for CI.
repos:
  # Keep this pinned to the ruff version in pyproject's dev group: pre-commit runs its
  # own copy, and a version skew makes `make lint` and the commit hook disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
