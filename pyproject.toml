[project]
name = "greenthumb"
version = "0.1.0"
description = "ReAct customer care agent for the GreenThumb gardening marketplace"
readme = "README.md"
requires-python = "==3.12.*"

# Versions pinned per docs/SPEC.md §2. Change only with a matching ADR entry.
dependencies = [
    # Agent core
    "langchain==1.4.2",
    "langchain-core==1.6.3",
    "langgraph==1.2.11",
    "langchain-litellm==0.7.2",
    "litellm==1.102.0",
    # Retrieval. The [full] extra is mandatory: langchain-huggingface 1.2.2 declares
    # sentence-transformers and transformers only under it (ADR-018).
    "langchain-huggingface[full]==1.2.2",
    "sentence-transformers>=5.2,<6",
    "langchain-chroma==1.1.0",
    "chromadb==1.5.9",
    "langchain-text-splitters==1.1.2",
    # Data and configuration
    "pydantic==2.13.5",
    "pydantic-settings>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    # API
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    # Evaluation
    "ragas==0.4.3",
    # ragas 0.4.3 imports langchain_community.chat_models.vertexai unconditionally, and
    # declares langchain-community with no pin. That module was removed in community 0.4.x,
    # so `import ragas` fails outright. 0.3.31 is the last release that still ships it and
    # is the only 0.3.x that accepts langchain-core 1.x. See ADR-019.
    "langchain-community==0.3.31",
    "deepeval==4.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pre-commit>=4.0",
    # The delivery notebook is a deliverable (SPEC section 13): nbformat builds it and
    # nbclient executes it so that the committed copy carries real outputs. Not needed to
    # run the agent, hence dev-only — Colab brings its own notebook runtime.
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenthumb"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "eval"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming — exam requirement (CLAUDE.md)
    "D",   # pydocstyle — docstring on every function, method and class
    "ANN", # type annotations everywhere
]
ignore = [
    "ANN401", # allow typing.Any where it is genuinely the right type
    "D203",   # mutually exclusive with D211 (ruff default style)
    "D213",   # mutually exclusive with D212 (ruff default style)
]

[tool.ruff.lint.per-file-ignores]
# build_notebook.py is mostly the delivery notebook's own content, held in triple-quoted
# strings: Markdown prose and the notebook's code cells. Reflowing that payload to 100
# columns would hurt the artefact being generated to satisfy a rule about this file's
# source, so E501 is off here only. The module's own code still obeys every other rule.
"scripts/build_notebook.py" = ["E501"]
# The notebook is a presentation artefact: a print line that runs past 100 columns reads
# better in a cell than wrapped, and annotating a one-off display helper is noise. The
# checks that catch real mistakes — undefined names, unused imports, bad imports — stay on,
# which is why the notebook is linted at all instead of excluded (ADR-075).
"notebooks/*.ipynb" = ["E501", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
# The formatter has its own line length and does not honour the linter's per-file ignores,
# so it would wrap the notebook's print statements across several lines — worse to read in a
# cell than the long line it replaces. Only formatting is skipped: `ruff check` still runs
# on the notebook and still catches undefined names and unused imports (ADR-075).
exclude = ["notebooks/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds runnable data tooling, not an installed package.
pythonpath = ["scripts"]
markers = [
    "llm: integration test that performs a real LLM call (excluded from `make test`)",
]
# -p no:deepeval: importing deepeval calls load_dotenv(), which leaks the developer's
# .env into os.environ for the whole session. We call its metrics directly (ADR-023/024),
# so the plugin buys us nothing. See ADR-025.
addopts = "-q -p no:deepeval"
