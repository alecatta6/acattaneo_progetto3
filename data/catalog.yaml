# GreenThumb Marketplace — product catalogue.
#
# Single source of truth for products (SPEC section 4.2). Product sheets, orders and every
# cross-reference in the knowledge base derive from this file; validate_data.py enforces the
# consistency. Prices are in euro, VAT included, as shown to the customer.
#
# sku                GT-<CAT>-<NNN>. CAT: SEM sementi, BUL bulbi, ATT attrezzi,
#                    VAS vasi, TER terricci, FER fertilizzanti.
# short_description  One line, customer-facing, in Italian. The product sheet expands on it
#                    and must not contradict it (ADR-034).
# perishable         Seeds and bulbs only: they drive the 14-day returns rule
#                    (policies/resi_rimborsi.md).
# season             Seasons in which the product is most relevant — for bulbs and seeds the
#                    planting or sowing window, for the rest the period of use. Values match
#                    exactly those returned by clock.season_of(), so the agent can compare them
#                    against the business date. All four seasons means year-round.
# kb_path            Path of the product sheet inside data/kb/, extension included (ADR-006).

products:

