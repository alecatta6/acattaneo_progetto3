# Single source of truth for products (SPEC section 4.2). Product sheets, orders and every
# cross-reference in the knowledge base derive from this file; validate_data.py enforces the
# consistency. Prices are in euro, VAT included, as shown to the customer.
#
# sku        GT-<CAT>-<NNN>. CAT: SEM sementi, BUL bulbi, ATT attrezzi,
#            VAS vasi, TER terricci, FER fertilizzanti.
# perishable Seeds and bulbs only: they drive the 14-day returns rule (policies/resi_rimborsi.md).
# kb_path    Path of the product sheet inside data/kb/, extension included (ADR-006).

